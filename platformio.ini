[platformio]
default_envs =
	ES3C28P
	;S3-ILI9341
	;m5stack-cardputer
	;m5stack-sticks3
	;m5stack-cplus2
	;m5stack-cplus1_1
	;LAUNCHER_m5stack-cplus1_1
	;m5stack-core2
	;m5stack-core16mb
	;m5stack-core4mb
	;m5stack-cores3
	;m5stack-dinmeter
	;arduino-nesso-n1
	;esp32-s3-devkitc-1
	;CYD-2432S028
	;CYD-2USB
	;CYD-2432W328C
	;CYD-2432W328C_2
	;CYD-2432W328R-or-S024R
	;CYD-3248S035R
	;CYD-3248S035C
	;LAUNCHER_CYD-2432W328R-or-S024R
	;LAUNCHER_CYD-2432S028
	;LAUNCHER_CYD-2USB
	;LAUNCHER_CYD-2432W328C
	;LAUNCHER_CYD-3248S035R
	;LAUNCHER_CYD-3248S035C
	;lilygo-t-embed-cc1101
	;lilygo-t-embed
	;lilygo-t-deck
	;lilygo-t-watch-s3
	;lilygo-t-deck-pro
	;lilygo-t-display-s3
	;lilygo-t-display-s3-touch
	;lilygo-t-display-s3-mmc
	;lilygo-t-display-s3-touch-mmc
	;lilygo-t-display-S3-pro
	;lilygo-t-display-ttgo
	;lilygo-t-hmi
	;lilygo-t-lora-pager
	;smoochiee-board
	;xk404
	;reaper
	;Phantom_S024R
	;LAUNCHER_Phantom_S024R
	;Marauder-Mini
	;LAUNCHER_Marauder-Mini
	;Awok-Mini
	;Marauder-v7
	;LAUNCHER_Marauder-v7
	;Marauder-V4-V6
	;Marauder-v61
	;LAUNCHER_Marauder-V4-V6
	;LAUNCHER_Marauder-v61
	;Awok-Touch
	;LAUNCHER_WaveSentry-R1
	;WaveSentry-R1
	;esp32-c5-tft
	;esp32-c5
	;nm-cyd-c5
	;elecrow-24B
	;elecrow-28B
	;elecrow-35B
	;elecrow-35Bv2_2
	;elecrow-advance-35-s3

build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
boards_dir = boards/_boards_json

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/builds/main_esp32-arduino-libs-20260715-140131.tar.gz

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
board_build.variants_dir = boards
board_build.filesystem = littlefs
build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing
	-D ENABLE_RAM_LOGGING=1

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>
	-<modules/bjs_interpreter/mqjs_stdlib.c>

build_flags =
	-DBRUCE_VERSION='"dev"'
	-DEEPROMSIZE=128
	-DLH=8
	-DLW=6
	-flto
	-ffunction-sections
	-fdata-sections
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DGIT_COMMIT_HASH='"Homebrew"'
	-DFASTLED_RMT_BUILTIN_DRIVER=1
	-Werror=odr
	-D CONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-DGEN_MQJS_HEADERS
	-DMBEDTLS_CONFIG_FILE=\"mbedtls/esp_config.h\"
	-DCONFIG_MBEDTLS_ECDH_C=1
	-DCONFIG_MBEDTLS_AES_C=1
	-DCONFIG_MBEDTLS_CTR_DRBG_C=1

extra_scripts =
	pre:patch.py
	pre:pre_build_current_year.py
	pre:gen_mqjs_headers.py
	pre:patch_library_conflicts.py
	flto_prep.py
	post:build.py

lib_deps =
	https://github.com/sayacom/WireGuard-ESP32-Arduino#feature/esp-netif
	https://github.com/bmorcelli/IRremoteESP8266
	paulstoffregen/Time@1.6.1
	LibSSH-ESP32
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/huckor/BER-TLV.git
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/bmorcelli/ESP-Amiibolink
	https://github.com/rennancockles/SimpleCLI
	https://github.com/whywilson/ESP-PN532BLE
	https://github.com/whywilson/ESP-PN532-UART
	https://github.com/whywilson/ESP-PN532Killer
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson
	ESP8266Audio@^2.4.1
	earlephilhower/ESP8266SAM@^1.1.0
	mikalhart/TinyGPSPlus
	tinyu-zhao/FFT@^0.0.1
	h2zero/NimBLE-Arduino@2.5
	nrf24/RF24 @ 1.4.11
	Adafruit Si4713 Library@1.2.3
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	mquickjs=https://github.com/BruceDevices/mquickjs#0.0.6
	https://github.com/bmorcelli/OneWire#patch-1
	https://github.com/bmorcelli/ESP32-PsRamFS#patch-1
	bitbank2/AnimatedGIF
	bitbank2/PNGdec @ ^1.1.2
	ESP32Async/ESPAsyncWebServer
	fastled/FastLED @^3.10.3
	jgromes/RadioLib @ ^7.4.0
	https://github.com/lewisxhe/ST25R3916-fork#0c8e00f49d12881d1cff6d6f0879b90ce7ed4033
	https://github.com/lewisxhe/NFC-RFAL-fork#7bde4587ea44c36c178a43d083d7a7345c1e4cfe

board_build.flash_mode = dio
board_build.f_flash = 80mhz

[env_light]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DLITE_VERSION=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_deps =
	https://github.com/BorisKofman/IRremoteESP8266#Espressif-version-3
	paulstoffregen/Time@1.6.1
	Adafruit BusIO=https://github.com/emericklaw/Adafruit-BusIO_Bruce@1.17.2-bruce.1
	Adafruit PN532=https://github.com/emericklaw/Adafruit-PN532_Bruce@1.3.3-bruce.1
	https://github.com/rennancockles/Arduino_MFRC522v2.git
	https://github.com/bmorcelli/ESP-ChameleonUltra
	https://github.com/rennancockles/SimpleCLI
	NTPClient@3.2.1
	ESP32Time@2.0.6
	FFat
	bblanchon/ArduinoJson@7.4.2
	mikalhart/TinyGPSPlus@1.1.0
	tinyu-zhao/FFT@0.0.1
	h2zero/NimBLE-Arduino@2.5
	nrf24/RF24 @ 1.4.11
	Bodmer/JPEGDecoder
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.9.6

[env_4mb]
extends = env
build_flags =
	-Os
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-D_IR_ENABLE_DEFAULT_=false
	-DDECODE_HASH=true
	-DDECODE_NEC=true
	-DSEND_NEC=true
	-DDECODE_SAMSUNG=true
	-DSEND_SAMSUNG=true
	-DDECODE_RC5=true
	-DSEND_RC5=true
	-DDECODE_RC6=true
	-DSEND_RC6=true
	-DDECODE_LG=true
	-DSEND_LG=true
	-DDECODE_SONY=true
	-DSEND_SONY=true
	-DSEND_PANASONIC=true
	-DDECODE_PANASONIC=true
	-DSEND_RAW=true

lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM
